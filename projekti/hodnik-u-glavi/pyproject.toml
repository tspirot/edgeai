[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hodnik-u-glavi"
version = "0.1.0"
description = "2D SLAM једним ласерским сензором — мапа и навигација, на самом уређају"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
lidar = ["rplidar-roboticia>=0.9.5"]
pwm = ["adafruit-circuitpython-pca9685>=3.4", "adafruit-blinka>=8.0"]
dev = ["pytest>=7"]

[project.scripts]
mapa = "mapa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
