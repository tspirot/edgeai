[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djak-za-volanom"
version = "0.1.0"
description = "Аутономна вожња 1:10 — камера држи траку, RPLIDAR је сигурносни слој"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
kamera = ["opencv-python>=4.8"]
lidar = ["rplidar-roboticia>=0.9.5"]
pwm = ["adafruit-circuitpython-pca9685>=3.4", "adafruit-blinka>=8.0"]
gamepad = ["evdev>=1.6"]
train = ["tensorflow>=2.13"]
dev = ["pytest>=7"]

[project.scripts]
volan = "volan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
