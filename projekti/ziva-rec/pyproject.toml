[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziva-rec"
version = "0.1.0"
description = "Жива реч — теренска станица за снимање и препис пиротског говора"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
zvuk = ["sounddevice>=0.4.6"]
asr = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7"]

[project.scripts]
govor = "govor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govor = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
