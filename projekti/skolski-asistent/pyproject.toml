[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skolski-asistent"
version = "0.1.0"
description = "Школски асистент — мултимодални помоћник на самом уређају, без облака"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
kamera = ["opencv-python>=4.8"]
zvuk = ["sounddevice>=0.4.6"]
asr = ["faster-whisper>=1.0.0"]
vlm = ["transformers>=4.45", "torch>=2.2", "accelerate>=0.30"]
tts = ["piper-tts>=1.2"]
rag = ["sentence-transformers>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
asistent = "asistent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
