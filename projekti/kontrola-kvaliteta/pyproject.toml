[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kontrola-kvaliteta"
version = "0.1.0"
description = "Визуелна контрола квалитета кроз детекцију аномалија — учи само на исправним комадима"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17", "pillow>=10"]
dev = ["pytest>=7"]

[project.scripts]
qc = "qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
