[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "znakovna-azbuka"
version = "0.1.0"
description = "Препознавање слова српске једноручне азбуке из тачака шаке — на уређају"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Техничка школа Пирот" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
hands = ["mediapipe>=0.10"]
dev = ["pytest>=7"]

[project.scripts]
znak = "znak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
