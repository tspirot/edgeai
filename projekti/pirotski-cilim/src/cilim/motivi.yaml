# Каталог шара — почетни, НЕПОТПУН и НЕПОТВРЂЕН.
#
# Званични каталог броји преко стотину шара и орнамената; овде их је шачица.
# Свака одредница носи `izvor` (одакле је назив преузет) и `potvrdila_radionica`
# (да ли је неко ко тка то потврдио). Програм уз свако значење исписује ту
# ознаку и НЕ приказује непотврђено значење као чињеницу.
#
# Посао ученика: проћи кроз ово са школском радионицом ћилима, исправити
# значења, допунити списак и `potvrdila_radionica` пребацити на `true` — уз име
# особе која је потврдила и датум. Тек тада одредница важи.
#
# `deo` (поље / бордура / ћенар) намерно стоји као „непознато“ где извор о томе
# ништа не каже. Боље празно него измишљено.
#
# Извори за називе:
#   nkns      — Национални регистар нематеријалног културног наслеђа Србије
#               (пиротско ћилимарство, упис 18.06.2012, редни број 6)
#   vikipedija — чланак „Пиротски ћилим“ на српској Википедији
#   literatura — секундарни извори о значењу шара (проверити код Музеја Понишавља)

verzija: 1

