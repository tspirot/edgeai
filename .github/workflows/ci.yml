name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [titlovi-uzivo, pametna-zebra, cuvar-stare-planine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: projekti/${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pytest
          python -m pytest -q
