# ==============================================================================
#                      КОНФИГУРАЦИЈА ЗА ПРОЈЕКАТ "КВО ТЕ"
#                 (AI машина са пиротским дијалектом за RPi 5)
# ==============================================================================

display:
  fullscreen: true        # true = цео екран на HDMI TV/монитору (тастер 'f' за промену)
  width: 1280
  height: 720
  fps: 30
  theme: "etno_cyber"     # etno_cyber | retro_terminal | dark_wood

audio:
  tts_enabled: true       # гласовни одговори преко espeak-ng звучника (тастер 'm' за mute)
  tts_speed: 145          # брзина говора (100 - 200)
  tts_pitch: 48           # тон гласа (старији пиротски чакшија)

ai:
  # Ако покренете Ollama на Pi 5, систем аутоматски користи LLM за генерисање.
  # Ако није покренут, ради тренутни офлајн Pirotski AI Engine.
  use_ollama: false
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3"

shortcuts:
  1: "Паре и штедња"
  2: "Јело и пиће"
  3: "Кво те мучи?"
  4: "Време и нишавац"
  5: "Љубав и брак"
  6: "Пиротски виц"
